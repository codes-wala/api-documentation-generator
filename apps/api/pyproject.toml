[project]
name = "api-documentation-generator-api"
version = "0.1.0"
description = "API documentation workspace backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
  "pydantic-settings>=2.5,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "google-genai>=1.0,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "markdown>=3.6,<4.0",
  "reportlab>=4.2,<5.0",
  "bleach>=6.1,<7.0",
  "httpx>=0.27,<1.0",
  "itsdangerous>=2.2,<3.0",
  "cryptography>=43.0,<46.0",
  "email-validator>=2.2,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
